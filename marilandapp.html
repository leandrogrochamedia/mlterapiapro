.btn{width:100%;padding:15px;border-radius:14px;background:linear-gradient(180deg,#7c3aed 0%,#6d28d9 100%);border:none;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:18px;box-shadow:0 8px 20px rgba(124,58,237,0.25)} .btn:disabled{opacity:.6}

    const sessao = {id: terapeuta.id, nome: terapeuta.nome||terapeuta.name, email: terapeuta.email, slug, password: pass, data: new Date().toISOString()};
    localStorage.setItem('terapeuta_sessao', JSON.stringify(sessao));
    localStorage.setItem('therapist_slug', slug);
    msg.style.color='#15803d'; msg.innerText='✅ Logado! Redirecionando...';
    setTimeout(()=>{ window.location.href='dashboard.html'; }, 800);
  }catch(e){
    console.error(e);
    msg.innerText='Erro: '+e.message;
    btn.disabled=false; btn.innerText='Entrar →';
  }
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });
window.addEventListener('load', ()=>{
  const sessao = localStorage.getItem('terapeuta_sessao');
  if(sessao){ try{ const d=JSON.parse(sessao); if(d.email){ document.getElementById('emailInput').value=d.email; } }catch(e){} }
});
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teste de Retorno</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f4f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.card{max-width:600px;width:100%;background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,0.08);padding:2rem}.input{width:100%;padding:12px 16px;border-radius:16px;background:rgba(0,0,0,0.02);border:1.5px solid rgba(0,0,0,0.06);outline:none;font-size:0.95rem;transition:0.2s}.input:focus{background:#fff;border-color:#2c3e50;box-shadow:0 0 0 4px rgba(44,62,80,0.06)}.btn{width:100%;padding:12px;border-radius:16px;background:#2c3e50;color:#fff;font-weight:700;border:none;cursor:pointer;transition:0.15s}.btn:hover{background:#1a2a3a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(44,62,80,0.2)}.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:linear-gradient(90deg,#27ae60,#f1c40f,#e74c3c);outline:none;cursor:pointer}.slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #2c3e50;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.1)}</style></head><body><div id="app" class="card"><h1 class="text-2xl font-black text-center">🔄 Teste de Retorno</h1><p class="text-sm text-center text-gray-500 mt-1">Reavalie suas travas após o processo terapêutico</p><div id="step1"><div class="space-y-3 mt-4"><div><label class="text-xs font-bold uppercase">Nome *</label><input id="nome" class="input" placeholder="Seu nome"></div><div><label class="text-xs font-bold uppercase">E-mail *</label><input id="email" class="input" placeholder="seu@email.com"></div><div><label class="text-xs font-bold uppercase">WhatsApp *</label><input id="whatsapp" class="input" placeholder="55DDD999999999"></div><div><label class="text-xs font-bold uppercase">Idade</label><input id="idade" class="input" type="number"></div><div><label class="text-xs font-bold uppercase">Profissão</label><input id="profissao" class="input"></div><div><label class="text-xs font-bold uppercase">Principais dores atuais</label><textarea id="problemas" rows="2" class="input"></textarea></div><div><label class="text-xs font-bold uppercase">Terapia anterior</label><select id="terapia" class="input"><option value="">Selecione</option><option>Não</option><option>Sim terapia</option><option>Sim constelação</option><option>Sim TAP</option></select></div><div><label class="text-xs font-bold uppercase">Renda mensal</label><select id="renda" class="input"><option value="">Selecione</option><option>Até 2k</option><option>2k a 5k</option><option>5k a 8k</option><option>8k a 15k</option><option>Acima 15k</option></select></div><div><label class="flex items-center gap-2 text-xs"><input type="checkbox" id="lgpd" class="accent-[#2c3e50]"> Concordo com a LGPD</label></div><button onclick="step2()" class="btn">Continuar</button></div></div><div id="step2" style="display:none"><div id="perguntas"></div><button onclick="submitTeste()" class="btn mt-4">Finalizar Retorno</button></div><div id="step3" style="display:none" class="text-center"><div class="w-16 h-16 rounded-full bg-green-600 text-white flex items-center justify-center text-3xl mx-auto">✓</div><h2 class="text-xl font-black mt-2">Seu Mapa de Travas (Retorno)</h2><div id="resultados" class="text-left mt-4"></div><a id="whatsappLink" target="_blank" class="btn bg-green-600 hover:bg-green-700 mt-4 flex items-center justify-center gap-2"><i class="fa-brands fa-whatsapp"></i> Falar com terapeuta</a></div></div><script>const TRAVAS=[{nome:'Ansiedade',desc:'Sinto que estou sempre preocupado com o futuro.'},{nome:'Procrastinação',desc:'Deixo para depois o que poderia fazer agora.'},{nome:'Culpa Excessiva',desc:'Sinto-me culpado por coisas que não são minha responsabilidade.'},{nome:'Autossabotagem',desc:'Quando algo vai bem, acabo fazendo algo para estragar.'},{nome:'Dificuldade de Dizer Não',desc:'Tenho dificuldade em recusar pedidos, mesmo quando me sobrecarrega.'},{nome:'Medo de Cobrar',desc:'Evito cobrar o que é meu por direito.'},{nome:'Baixa Autoconfiança',desc:'Não acredito que sou capaz de realizar grandes coisas.'},{nome:'Perfeccionismo',desc:'Preciso que tudo seja perfeito, senão não vale a pena.'},{nome:'Dependência Emocional',desc:'Preciso da aprovação dos outros para me sentir bem.'},{nome:'Dificuldade com Críticas',desc:'Levo críticas como ataques pessoais.'];
let scores=Array(10).fill(5);
function step2(){const nome=document.getElementById('nome').value,email=document.getElementById('email').value,whatsapp=document.getElementById('whatsapp').value,lgpd=document.getElementById('lgpd').checked;if(!nome||!email||!whatsapp||!lgpd){alert('Preencha todos os campos obrigatórios.');return}
document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';
let html='';TRAVAS.forEach((t,i)=>{html+=`<div class="border-b pb-3 mb-3"><div class="flex justify-between"><span class="font-bold">${i+1}. ${t.nome}</span><span class="font-bold text-[#2c3e50]" id="val${i}">${scores[i].toFixed(1)}</span></div><p class="text-xs text-gray-500">${t.desc}</p><input type="range" min="0" max="10" step="0.1" value="${scores[i]}" oninput="updateScore(${i},this.value)" class="slider"></div>`});document.getElementById('perguntas').innerHTML=html;}
function updateScore(i,v){scores[i]=parseFloat(v);document.getElementById('val'+i).textContent=Number(v).toFixed(1);}
function submitTeste(){const nome=document.getElementById('nome').value,whatsapp=document.getElementById('whatsapp').value;const resultados=TRAVAS.map((t,i)=>({nome:t.nome,score:scores[i]}));resultados.sort((a,b)=>b.score-a.score);let html='';resultados.forEach(r=>{html+=`<div class="flex items-center gap-2 text-sm"><span class="w-32 font-bold">${r.nome}</span><div class="flex-1 h-2 bg-gray-200 rounded-full"><div class="h-full rounded-full" style="width:${r.score*10}%" class="${r.score>7.5?'bg-red-500':r.score>5?'bg-orange-400':r.score>2.5?'bg-yellow-400':'bg-green-400'}"></div></div><span class="w-8 text-right">${r.score.toFixed(1)}</span></div>`});document.getElementById('resultados').innerHTML=html;document.getElementById('step2').style.display='none';document.getElementById('step3').style.display='block';const link=document.getElementById('whatsappLink');const phone=window.terapeutaWhatsapp||'5541996289968';link.href=`https://wa.me/${phone}?text=${encodeURIComponent(`Olá! Acabei de fazer o teste de retorno. Meu nome é ${nome}. Minha maior trava atual é ${resultados[0].nome} (${resultados[0].score.toFixed(1)}/10).`)}`;}
const params=new URLSearchParams(window.location.search);const slug=params.get('slug')||'mariland-rodrigues';window.terapeutaWhatsapp='5541996289968';
</script></body></html>

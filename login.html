<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Terapia Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,sans-serif;background:linear-gradient(160deg,#faf5ff 0%,#fdf2f8 50%,#f0fdf4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1c3d38}
.card{background:#fff;width:100%;max-width:420px;border-radius:32px;border:1.5px solid #e9d5ff;box-shadow:0 20px 60px rgba(124,58,237,.08);padding:36px 28px 28px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.logo{
  display:block;
  width:100%;
  max-width:280px;
  height:auto;
  margin:0 auto 6px;
  user-select:none;
  -webkit-user-drag:none;
  filter: drop-shadow(0 8px 22px rgba(124,58,237,.10));
}

h1.brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;text-align:center;margin-top:4px;color:#1c3d38;letter-spacing:1.5px;text-transform:uppercase}
.sub{font-size:11.5px;color:#8b5cf6;text-align:center;margin-top:4px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:#faf5ff;border:1.5px solid #e9d5ff;border-radius:14px;padding:4px;margin-top:22px;max-width:300px;margin-left:auto;margin-right:auto}
.tab{flex:1;padding:8px 10px;border-radius:10px;border:none;background:transparent;font-family:inherit;font-size:10.5px;font-weight:800;color:#7c3aed;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.tab:not(.active):hover{background:#fff;color:#7c3aed}
.pane{margin-top:24px}
.pane.hidden{display:none}
label{display:block;font-size:10px;font-weight:800;color:#991b1b;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #e9d5ff;background:#fef9f6;font-family:inherit;font-size:14px;outline:none;transition:.2s;color:#1c3d38}
input:focus{border-color:#7c3aed;background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.field{margin-bottom:16px}
.btn-primary{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;margin-top:8px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(124,58,237,.25)}
.btn-primary:hover{background:linear-gradient(135deg,#7c3aed,#6d28d9);transform:translateY(-1px);box-shadow:0 8px 20px rgba(124,58,237,.4)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#c4b5fd;font-size:11px;font-weight:700;letter-spacing:.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e9d5ff}
.link-cadastro{background:transparent;border:none;font-family:inherit;font-size:12.5px;font-weight:800;color:#7c3aed;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 10px;display:block;margin:8px auto 0;transition:.2s}
.link-cadastro:hover{color:#6d28d9}
.msg{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:700;margin-top:14px;display:none}
.msg.show{display:block}
.msg.error{background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8}
.msg.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.register-pane{text-align:center;padding:20px 0}
.register-pane h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:8px;color:#1c3d38}
/* ═════ DEBUG-LOGIN-REMOVER ═════ */
.debug-links{margin-top:22px;padding-top:16px;border-top:1px dashed #e9d5ff}
.debug-links-title{font-size:9.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#c4b5fd;text-align:center;margin-bottom:10px}
.debug-links-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.debug-link{flex:1;min-width:140px;padding:10px 12px;border-radius:11px;border:1.5px dashed #e9d5ff;background:#faf5ff;font-family:inherit;font-size:11px;font-weight:800;color:#7c3aed;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.debug-link:hover{background:#7c3aed;color:#fff;border-color:#7c3aed;border-style:solid;transform:translateY(-1px);box-shadow:0 6px 16px rgba(124,58,237,.3)}
.debug-link:disabled{opacity:.5;cursor:wait;transform:none}
.debug-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7;flex-shrink:0}
/* ═════ /DEBUG-LOGIN-REMOVER ═════ */
.register-pane p{font-size:12.5px;color:#7c3aed;line-height:1.55;margin-bottom:22px}
</style>
</head>
<body>
<div class="card">

  <img class="logo" src="images/logo-mlterapiapro.png" alt="ML Terapia Pro">
  <p class="sub">Sistema de Gestão Clínica</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">👤 Login</button>
    <button class="tab" data-tab="register">👥 Cadastrar Terapeuta</button>
  </div>

  <div class="pane" id="pane-login">
    <div class="field">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="msg" id="msg"></div>
    <button class="btn-primary" id="btnEntrar" onclick="fazerLogin()">Entrar <span style="font-size:16px">→</span></button>

    <!-- ═════ DEBUG-LOGIN-REMOVER — REMOVER ANTES DE PRODUCAO ═════ -->
    <div class="debug-links">
      <div class="debug-links-title">🔧 Acesso rápido (debug)</div>
      <div class="debug-links-row">
        <button type="button" class="debug-link" onclick="debugLogin('marilandrodrigues7@gmail.com','092824',this)">
          <span class="debug-dot"></span> Mariland
        </button>
        <button type="button" class="debug-link" onclick="debugLogin('leandrogrocha@gmail.com','leandro123',this)">
          <span class="debug-dot"></span> Leandro
        </button>
        <button type="button" class="debug-link" onclick="debugLogin('contato@roberleiacostacurta.com.br','1234567',this)">
          <span class="debug-dot"></span> Roberléia
        </button>
      </div>
    </div>
    <!-- ═════ /DEBUG-LOGIN-REMOVER ═════ -->

    <div class="divider">ou</div>
    <button class="link-cadastro" onclick="window.location.href='onboarding.html'">Cadastrar novo terapeuta →</button>
  </div>

  <div class="pane hidden" id="pane-register">
    <div class="register-pane">
      <h2>Criar conta de terapeuta</h2>
      <p>Preencha seus dados profissionais e configure seu acesso à plataforma. Leva menos de 2 minutos.</p>
      <button class="btn-primary" onclick="window.location.href='onboarding.html'">👤 Começar cadastro</button>
    </div>
    <p style="font-size:11px;color:#16a34a;text-align:center;margin-top:22px;font-weight:600">Já tem conta? <a href="#" onclick="trocarAba('login');return false;" style="color:#991b1b;font-weight:800;text-decoration:none">Fazer login</a></p>
  </div>
</div>

<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => trocarAba(t.dataset.tab));
});

function trocarAba(nome){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === nome));
  document.getElementById('pane-login').classList.toggle('hidden', nome !== 'login');
  document.getElementById('pane-register').classList.toggle('hidden', nome !== 'register');
}

function mostrarMsg(txt, tipo){
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg show ' + (tipo === 'ok' ? 'ok' : 'error');
}

async function fazerLogin(){
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btnEntrar');

  if (!email || !senha) return mostrarMsg('Preencha e-mail e senha.', 'error');

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    // Limpa sessão anterior (permite trocar de terapeuta sem logout manual)
    try { await sb.auth.signOut(); } catch(e){}

    // 🔐 Supabase Auth
    const { data: authData, error: authErr } = await sb.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (authErr) {
      const msg = (authErr.message || '').toLowerCase();
      if (msg.includes('invalid login') || msg.includes('invalid credentials')) {
        return mostrarMsg('E-mail ou senha incorretos.', 'error');
      }
      if (msg.includes('email not confirmed')) {
        return mostrarMsg('Conta ainda não confirmada. Fale com o suporte.', 'error');
      }
      return mostrarMsg(authErr.message || 'Erro ao entrar.', 'error');
    }

    if (!authData || !authData.user) {
      return mostrarMsg('Erro inesperado. Tente novamente.', 'error');
    }

    // Busca dados completos da terapeuta logada (RPC autenticada)
    const { data: terapeutaArr, error: terErr } = await sb.rpc('get_minha_terapeuta');
    if (terErr) throw terErr;

    const terapeuta = Array.isArray(terapeutaArr) ? terapeutaArr[0] : terapeutaArr;
    if (!terapeuta || !terapeuta.slug) {
      await sb.auth.signOut();
      return mostrarMsg('Cadastro incompleto. Fale com o suporte.', 'error');
    }

    localStorage.setItem('therapist_slug', terapeuta.slug);
    localStorage.setItem('mlterapiapro_last_email', email);
    localStorage.setItem('mlterapiapro_last_login_at', new Date().toISOString());

    window.location.href = 'dashboard-v2.html';
  } catch (e) {
    console.error('[login]', e);
    mostrarMsg('Erro: ' + (e.message || 'desconhecido'), 'error');
    btn.disabled = false;
    btn.innerHTML = 'Entrar <span style="font-size:16px">→</span>';
  }
}

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

// ═════ DEBUG-LOGIN-REMOVER — REMOVER ANTES DE PRODUCAO ═════
async function debugLogin(email, senha, btn){
  if(btn) btn.disabled = true;
  document.getElementById('email').value = email;
  document.getElementById('senha').value = senha;
  await fazerLogin();
  if(btn) btn.disabled = false;
}
// ═════ /DEBUG-LOGIN-REMOVER ═════

// Auto-login se já tem sessão ativa (pula se ?logout=1)
(async function(){
  if (new URLSearchParams(window.location.search).get('logout') === '1') {
    try { await sb.auth.signOut(); } catch(e){}
    window.history.replaceState({}, '', 'login.html');
  } else {
    try{
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        const { data: terapeutaArr } = await sb.rpc('get_minha_terapeuta');
        const terapeuta = Array.isArray(terapeutaArr) ? terapeutaArr[0] : terapeutaArr;
        if (terapeuta && terapeuta.slug) {
          localStorage.setItem('therapist_slug', terapeuta.slug);
          window.location.href = 'dashboard-v2.html';
          return;
        }
      }
    }catch(e){ /* sem sessão, tudo bem */ }
  }

  const email = localStorage.getItem('mlterapiapro_last_email');
  if (email) document.getElementById('email').value = email;
  try { localStorage.removeItem('mlterapiapro_last_password'); } catch(e) {}
  try { localStorage.removeItem('terapeuta_sessao'); } catch(e) {}
})();
</script>
</body>
</html>

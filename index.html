<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Terapia Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Inter, sans-serif;
  }

  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #faf5ff 0%, #fdf2f8 50%, #f0fdf4 100%);
    z-index: 9999;
    cursor: pointer;
  }

  .logo-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    will-change: opacity, filter, transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    animation: splashKiss 3s linear 0s both;
  }

  .logo-wrap img {
    width: min(64vw, 470px);
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 12px 32px rgba(124,58,237,.18));
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7c3aed;
    opacity: .75;
    font-weight: 600;
    margin-top: -9px;
  }

  @keyframes splashKiss {
    0%   { opacity: 0;    filter: blur(44px); transform: scale(.92); }
    5%   { opacity: .22;  filter: blur(34px); transform: scale(.94); }
    11%  { opacity: .55;  filter: blur(22px); transform: scale(.96); }
    17%  { opacity: .85;  filter: blur(10px); transform: scale(.98); }
    25%  { opacity: 1;    filter: blur(0px);  transform: scale(1);   }
    65%  { opacity: 1;    filter: blur(0px);  transform: scale(1);   }
    77%  { opacity: .78;  filter: blur(10px); transform: scale(1.015); }
    88%  { opacity: .38;  filter: blur(24px); transform: scale(1.035); }
    100% { opacity: 0;    filter: blur(44px); transform: scale(1.05);  }
  }
</style>
</head>
<body>

<div class="splash" id="splash" onclick="irParaLogin()">
  <div class="logo-wrap">
    <img src="images/logo-mlterapiapro.png" alt="ML Terapia Pro">
    <div class="tagline">Sistema de Gestão Clínica</div>
  </div>
</div>

<script>
  const NAVEGAR_EM = 3000;
  let _jaFoi = false;

  try { (new Image()).src = 'images/logo-mlterapiapro.png'; } catch(e) {}

  function irParaLogin(){
    if(_jaFoi) return;
    _jaFoi = true;
    window.location.replace('Login.html');
  }

  setTimeout(irParaLogin, NAVEGAR_EM);
</script>

</body>
</html>
